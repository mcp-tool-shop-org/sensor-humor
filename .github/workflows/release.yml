name: Release

# Intentional deviation from the studio's "release: published only" rule: this job
# AUTHORS the GitHub Release itself (gh release create, below), so it must fire on the
# tag push — release:published would invert the ordering. The publish-on-an-accidental-tag
# risk is closed by the "Verify tag matches package.json version" guard before any publish.
# Trusted publisher is bound to this filename with no environment — do not add one.
on:
  push:
    tags: ['v*']

# Jobs escalate. npm-release needs contents:write (gh release) + id-token:write
# (npm provenance). docker needs packages:write. verify is read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm pack dry-run (verify tarball shape)
        run: npm pack --dry-run

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # awk-implementation-independent extraction (cdt-005): gawk and mawk differ on
          # dynamic-regex backslash handling, and an unescaped '.' in the version string is a
          # regex wildcard. Use an exact-prefix string match in node, and FAIL LOUDLY if the
          # section is missing rather than silently shipping a barren "See CHANGELOG.md" body.
          node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const version = (process.env.REF_NAME || "").replace(/^v/, "");
            const target = "## [" + version + "]";
            const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            if (!lines.some((l) => l.indexOf(target) === 0)) {
              console.error("::error::No CHANGELOG section found for " + target);
              process.exit(1);
            }
            let capture = false; const out = [];
            for (const line of lines) {
              if (/^## \[/.test(line)) { if (capture) break; capture = line.indexOf(target) === 0; continue; }
              if (capture) out.push(line);
            }
            const notes = out.join("\n").trim();
            writeFileSync("RELEASE_NOTES.md", (notes || "See CHANGELOG.md") + "\n");
          '
          echo "--- RELEASE_NOTES.md ---"; cat RELEASE_NOTES.md

  npm-release:
    name: GitHub Release + npm publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release creation
      id-token: write # npm provenance via Sigstore OIDC (trusted publishing)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const version = (process.env.REF_NAME || "").replace(/^v/, "");
            const target = "## [" + version + "]";
            const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            if (!lines.some((l) => l.indexOf(target) === 0)) {
              console.error("::error::No CHANGELOG section found for " + target);
              process.exit(1);
            }
            let capture = false; const out = [];
            for (const line of lines) {
              if (/^## \[/.test(line)) { if (capture) break; capture = line.indexOf(target) === 0; continue; }
              if (capture) out.push(line);
            }
            const notes = out.join("\n").trim();
            writeFileSync("RELEASE_NOTES.md", (notes || "See CHANGELOG.md") + "\n");
          '

      # GitHub Release is created BEFORE npm publish so a post-publish flake cannot
      # leave @mcptoolshop/sensor-humor@x.y.z on npm with no Release. Idempotent so
      # a re-run after a successful create can still reach npm publish.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping create"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "sensor-humor ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi

      - name: Install npm >=11.5 in a sandbox for OIDC trusted publishing
        run: |
          # Node 22 bundles npm 10.9; in-place `npm i -g npm@latest` races on its
          # arborist rebuild (MODULE_NOT_FOUND: promise-retry). Install npm@latest
          # into an isolated sandbox and shadow the system npm via PATH instead.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Last irreversible side-effect of this job. Skip when the version is already
      # on the registry so a re-run after a successful publish (or a partial prior
      # run) does not fail npm-release and is not required for GHCR (docker needs
      # verify, not this job).
      - name: Publish to npm with provenance (OIDC trusted publisher)
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "${PUBLISHED}" = "${PKG_VERSION}" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

  docker:
    name: Build + push image to GHCR
    runs-on: ubuntu-latest
    # Idempotent verify only — do not needs: npm-release. npm publish is not
    # retry-safe; a post-publish failure used to skip this job forever.
    needs: verify
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/mcp-tool-shop-org/sensor-humor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
